name: Avisos de pluja

on:
  schedule:
    - cron: '0 6 * * *'   # cada dia a les 7 (hivern) o les 8 (estiu)
  workflow_dispatch:
    inputs:
      prova:
        description: 'Envia també un missatge de prova'
        type: boolean
        default: false

permissions:
  contents: write   # per desar el mapa de "on hi ha bolets ara"

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mira la pluja i avisa
        run: python3 tools/avisos.py ${{ inputs.prova && '--prova' || '' }}
      - name: Pluja de tot Catalunya per al mapa
        continue-on-error: true
        run: |
          python3 tools/grid_wx.py
          git config user.name "boletus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grid_wx.json
          git diff --cached --quiet || (git commit -m "Mapa de bolets d'avui" && git push)
