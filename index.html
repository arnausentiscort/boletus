<!doctype html>
<html lang="ca"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boletus</title>
<meta name="description" content="Quan anar a buscar ceps, ous de reig, rovellons, fredolics, llenegues i camagrocs, amb la pluja de cada dia.">
<meta name="theme-color" content="#132417">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boletus">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dues pestanyes (Llocs, Mapa). Cada lloc s'obre en una fitxa amb el calendari d'un mes: aigua en blau, dies de bolets en verd */
:root{
  --bg:#E9EDE2; --surface:#F8FAF3; --surface2:#EFF2E8; --ink:#1C2218; --muted:#5D6655; --line:#D0D7C4;
  --moss:#3E5B2B; --on-moss:#F8FAF3;
  --go:#2E8B4B; --go-soft:#CDEBD5; --soon:#A86F08; --soon-soft:#F6E7C6; --wait:#7E857A; --wait-soft:#E3E6DE;
  --rain:#2F67A6; --rain-soft:#D6E5F4; --obaga:#3468C8; --solana:#E88430; --cep:#7A4A2A; --sun:#D98A0B;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10140D; --surface:#192015; --surface2:#222B1D; --ink:#E5EADD; --muted:#9BA591; --line:#2F3A28;
  --moss:#A3C982; --on-moss:#14190F;
  --go:#5FC683; --go-soft:#1F4A2C; --soon:#E6AD45; --soon-soft:#3A2E14; --wait:#868E7F; --wait-soft:#262B22;
  --rain:#7FB0E0; --rain-soft:#1D2D3D; --cep:#D9A57E; --sun:#F0B54A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10140D; --surface:#192015; --surface2:#222B1D; --ink:#E5EADD; --muted:#9BA591; --line:#2F3A28;
  --moss:#A3C982; --on-moss:#14190F;
  --go:#5FC683; --go-soft:#1F4A2C; --soon:#E6AD45; --soon-soft:#3A2E14; --wait:#868E7F; --wait-soft:#262B22;
  --rain:#7FB0E0; --rain-soft:#1D2D3D; --cep:#D9A57E; --sun:#F0B54A; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;padding-block:14px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
body{padding-top:env(safe-area-inset-top,0px)}
a.btn{text-decoration:none;text-align:center;display:inline-block}
.coords{font-family:var(--f-data);font-size:13px;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:24px;font-weight:800;line-height:1;font-style:italic;letter-spacing:-.02em}
.brand{display:flex;flex-direction:column;gap:3px}
:root{--acc:#8A5530;--acc-soft:rgba(138,85,48,.14)}
:root[data-species="rov"]{--acc:#E2701F;--acc-soft:rgba(226,112,31,.16)}
:root[data-species="hiv"]{--acc:#6F8499;--acc-soft:rgba(111,132,153,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--acc:#D9A57E;--acc-soft:rgba(217,165,126,.13)}
  :root:not([data-theme="light"])[data-species="rov"]{--acc:#F39A4C;--acc-soft:rgba(243,154,76,.15)}
  :root:not([data-theme="light"])[data-species="hiv"]{--acc:#A9BBCB;--acc-soft:rgba(169,187,203,.14)}}
body{background-image:radial-gradient(120% 60% at 50% -10%,var(--acc-soft),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;transition:background-color .3s}
.spsw{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:5px;margin:0 0 2px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 22px),transparent 100%)}
.spsw::-webkit-scrollbar{display:none}
.spsw button{flex:1 1 0;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:0;background:transparent;color:var(--muted);font:800 14px var(--f-display);padding:7px 4px;border-radius:12px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.spsw button svg{flex:none;transition:transform .25s;filter:saturate(.35) opacity(.7)}
.spsw button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 -3px 0 var(--acc)}
.spsw button[aria-pressed=true] svg{transform:scale(1.12) rotate(-4deg);filter:none}
.logo-wrap{position:relative;width:44px;height:44px;flex:none}
.logo-wrap .logo{position:absolute;inset:0;transition:opacity .35s,transform .35s}
.logo-wrap .logo.off{opacity:0;transform:scale(.8) rotate(-8deg)}
.brand .tag{color:var(--acc)!important;transition:color .3s}
.empty{align-items:center;text-align:center;padding:26px 18px;gap:12px}
.empty h3{font-size:22px}
.empty svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.logo{flex:none;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--moss);color:var(--on-moss);font-family:var(--f-display);font-size:17px}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-family:var(--f-body);font-size:15px;font-weight:700;padding:9px 13px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;border-radius:999px;padding:4px 11px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-go{color:var(--go);background:var(--go-soft)} .s-soon{color:var(--soon);background:var(--soon-soft)} .s-wait{color:var(--wait);background:var(--wait-soft)}

/* Sol */
.sun{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(240,181,74,.18),transparent 55%),var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.sun strong{font-family:var(--f-display);font-size:18px}

/* Llista de llocs */
.spot{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--acc-soft),transparent 38%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.spot .mark{position:absolute;right:-10px;bottom:-12px;opacity:.07;pointer-events:none;transform:rotate(-12deg)}
.spot>*{position:relative}
.spot .name{font-family:var(--f-display);font-weight:800;font-size:21px}
.spot .what{font-size:15.5px}
.strip{display:grid;grid-template-columns:repeat(21,1fr);gap:2px;align-items:end;width:100%}
.strip i{display:block;height:20px;border-radius:3px;background:var(--surface2);position:relative}
.strip i.b{background:var(--go-soft);box-shadow:inset 0 0 0 1.5px var(--go)}
.strip i.p{background:var(--go)}
.strip i.t{outline:2px solid var(--ink);outline-offset:1px}
.strip i u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--rain);text-decoration:none;box-shadow:0 0 0 1.5px var(--surface)}
.strip i u.f{opacity:.5}
.striplab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);width:100%}
.last{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* Fitxa */
.back{background:none;border:0;padding:0;color:var(--moss);font-weight:800;align-self:flex-start;font-size:16px}
.big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.08}
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h3{font-size:18px;flex:1;text-align:center}
.cal-head button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:800;font-size:18px}
.cal-head button:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.day{position:relative;aspect-ratio:1/1.34;border-radius:10px;background:var(--surface2);border:0;padding:3px 0 0;display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:0}
.fchip{display:inline-block;font-weight:800;font-size:12.5px;border-radius:999px;padding:2px 9px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.f-bona{background:var(--go);color:#fff}.f-normal{background:var(--go-soft);color:var(--go);box-shadow:inset 0 0 0 1.5px var(--go)}.f-fluixa{background:var(--wait-soft);color:var(--wait)}
.fbar{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:14px}
.fbar i{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:block}.fbar i b{display:block;height:100%;border-radius:4px;background:var(--go)}
.day .tm{font:500 10px/1.15 var(--f-data);color:var(--muted)}
.day .tm.cold{color:#5B9BE0;font-weight:700}.day .tm.hot{color:#E8843A;font-weight:700}.day .tm.f{opacity:.6}
.day.top .tm{color:#fff;opacity:.9}
.day.cx{box-shadow:inset 0 0 0 1.5px #5B9BE0;background-image:repeating-linear-gradient(135deg,rgba(91,155,224,.16) 0 4px,transparent 4px 8px)}
.day .n{font-weight:700;line-height:1.1}
.day.bol{background:var(--go-soft)}
.day.bol .n{color:var(--go)}
.day.top{background:var(--go)}
.day.top .n{color:#fff}
.day.top .drop{opacity:1;filter:brightness(2.2)}
.day.top .drop span{color:#fff}
.day.out{opacity:.4}
.day.today{outline:2.5px solid var(--ink);outline-offset:1px}
.day.sel{box-shadow:0 0 0 3px var(--moss) inset}
.day .drop{display:flex;flex-direction:column;align-items:center;margin-top:auto;margin-bottom:3px;line-height:1}
.day .drop span{font-family:var(--f-data);font-size:10px;color:var(--rain);font-weight:500}
.day .drop.f{opacity:.5}
.day .c{position:absolute;top:-5px;right:-4px;z-index:1;box-shadow:0 0 0 2px var(--surface);font-size:9.5px;font-weight:800;color:#fff;background:var(--acc);border-radius:999px;min-width:15px;height:15px;line-height:15px;text-align:center;padding:0 2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block;flex:none}
.daynote{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:15px}
.facebar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.facebar i{display:block;height:100%}

/* Diari */
.sheet{display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepper button{width:46px;height:46px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:24px;font-weight:700}
.stepper output{font-family:var(--f-display);font-size:46px;font-weight:800;min-width:70px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
input[type=time],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px;box-sizing:border-box;width:100%}
.visit{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.visit:first-of-type{border-top:0;padding-top:0}

/* Mapa */
.mapbox{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
#map{width:100%;height:calc(100vh - 250px);height:calc(100dvh - 250px);min-height:420px;max-height:900px;background:#9DA6AA}
/* Mapa: botons rodons, panell de capes i fitxa que surt per sobre del mapa */
.mapctl{position:absolute;right:10px;bottom:22px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.rbtn{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(25,32,21,.9);color:#E5EADD;box-shadow:0 2px 8px rgba(0,0,0,.45);font-size:20px}
.rbtn[aria-expanded=true]{background:#A3C982;color:#14190F}
.rbtn.busy{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.5}}
.laypanel{position:absolute;right:66px;bottom:22px;z-index:1000;width:min(250px,calc(100% - 90px));background:rgba(25,32,21,.95);color:#E5EADD;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.laypanel .opt{background:rgba(255,255,255,.08);color:#E5EADD;border-color:rgba(255,255,255,.18);text-align:left}
.laypanel .opt[aria-pressed="true"]{background:#A3C982;color:#14190F;border-color:#A3C982}
.laypanel label{color:#B9C3AE;margin:4px 0 0}
.laypanel select{font:inherit;font-size:15px;color:#14190F;background:#E5EADD;border:0;border-radius:10px;padding:8px}
#mapcard.msheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:1100;max-height:58%;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.5);border-radius:18px;padding-top:16px}
#mapcard.msheet:not(.open){display:none}
.mclose{position:sticky;top:0;align-self:flex-end;flex:none;margin:-8px -4px -30px 0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:16px;z-index:2}
.mapbox.has-sheet .mapctl,.mapbox.has-sheet .laypanel{display:none}
.mapkey{pointer-events:auto;cursor:pointer}
.mapkey.mini span{display:none}
.mapkey.mini::before{content:"Llegenda ▾";font-weight:700}
.mview{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px}
.mview button{border:0;background:transparent;color:var(--muted);font:800 14px var(--f-display);padding:8px 4px;border-radius:999px}
.mview button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--acc)}
.maphint{font-size:13px;color:var(--muted);text-align:center}
/* Inici */
.hero{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.hero .small{white-space:nowrap}
.hero h2{font-size:22px}
.ini{display:flex;flex-direction:column;gap:12px}
html{touch-action:manipulation}
.segl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:-4px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px}
.sq{position:relative;border:0;background:transparent;border-radius:999px;padding:8px 4px;font-size:16px!important;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:14px;min-width:0;line-height:1.05}
.sq svg{width:28px;height:28px;flex:none}
.sq .nm{overflow:hidden;text-overflow:ellipsis}
.sq .dot{position:absolute;top:5px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--go)}
.sq .dot.soon{background:var(--soon)}
.sq[data-k=ceps]{--c:#8A5530}.sq[data-k=rov]{--c:#E2701F}.sq[data-k=hiv]{--c:#6F8499}
.sq[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--c),0 2px 6px rgba(0,0,0,.25)}
.sq.off{opacity:.55}
.inidet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14.5px;color:var(--muted);min-height:44px}
.inidet b{color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{aspect-ratio:1/.82;border-radius:22px;border:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-family:var(--f-display);color:var(--on-moss);background:var(--moss)}
.mode.alt{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.mode svg{width:34px;height:34px}
.mode b{font-size:19px;line-height:1.1}
.mode small{display:block;font-family:var(--f-body,inherit);font-size:12.5px;font-weight:600;opacity:.8;margin-top:3px}
.mkt{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px;padding:10px 14px;border-radius:16px;border:1px dashed var(--line)}
.mkt:empty{display:none}
.muted{color:var(--muted);font-weight:500}
.mkt .lbl{flex-basis:100%;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.altres{font-size:13px;color:var(--muted);text-align:center;margin:-2px 0}
.inilink{align-self:center;background:none;border:0;color:var(--muted);font-weight:700;text-decoration:underline;padding:6px}
body[data-screen=inici] .spsw{display:none}
.tabs nav{grid-template-columns:1fr 1fr 1fr!important}

.town{font:800 13px var(--f-body);color:#fff;text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;white-space:nowrap;text-align:center;letter-spacing:.02em}
.town.big{font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.casa{width:20px;height:20px;display:grid;place-items:center;background:#6E4C33;border:1.5px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.5);box-sizing:border-box}
.casa span{display:flex;flex-direction:column;line-height:1.05}
.casa b{font:800 13px var(--f-display)}
.casa small{font:700 10px var(--f-body);opacity:.85}
.layerbar{position:absolute;left:8px;right:8px;bottom:26px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.layerbar .opt{pointer-events:auto;box-shadow:0 1px 6px rgba(0,0,0,.45);background:rgba(25,32,21,.88);color:#E5EADD;border-color:rgba(255,255,255,.18);font-size:13.5px;padding:8px 12px}
.layerbar .opt[aria-pressed="true"]{background:#A3C982;color:#14190F;border-color:#A3C982}
.mapkey{position:absolute;top:8px;right:8px;z-index:1000;background:rgba(25,32,21,.85);color:#E5EADD;border-radius:10px;padding:6px 9px;font-size:12px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.mapkey span{display:flex;align-items:center;gap:6px}
.sw-acid{background:repeating-linear-gradient(45deg,#7B3FA0 0 2px,rgba(123,63,160,.25) 2px 5px);outline:1.5px solid #60288A}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag2{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 10px;font-weight:800;font-size:15px}
.t-acid{background:#EBDDF5;color:#5B2580}.t-calc{background:#F3E2DC;color:#8A3B22}.t-unk{background:var(--surface2);color:var(--muted)}
.t-ob{background:#DCE6FA;color:#244E9C}.t-so{background:#FBE5D2;color:#9A4A0E}.t-pla{background:var(--surface2);color:var(--muted)}
.pin{display:flex;flex-direction:column;align-items:center}
.pin svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.pin em{font-style:normal;font-weight:800;font-size:12px;background:#fff;color:#1c2218;border-radius:6px;padding:1px 7px 1px 5px;margin-top:2px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;gap:5px}
.pin em i{width:9px;height:9px;border-radius:50%;display:inline-block}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px}
.bars i{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;display:block}
.bars i b{display:block;height:100%;border-radius:4px}
.spotn{width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;color:#fff;font:800 14px/23px var(--f-display);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.6);box-sizing:border-box}
.tapmark{width:14px;height:14px;border-radius:50%;border:3px solid #fff;background:#7A2E8E;box-shadow:0 0 0 2px #7A2E8E}
.vtx{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #7A2E8E}
.leaflet-container .gris img,.leaflet-container img.gris{filter:grayscale(1) contrast(.75) brightness(1.18)}
.leaflet-container img.multi{mix-blend-mode:multiply}

/* Com funciona */
.how p,.how li{font-size:15.5px}
.how ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.slider label{margin:0}
.slider output{font-family:var(--f-data)}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--moss)}

/* Pestanyes */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:2000;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.zone{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.zone:first-of-type{border-top:0}
.zone .km{font-family:var(--f-display);font-weight:800;font-size:22px}
.zone .meta{font-size:14px;color:var(--muted)}
.seg3{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--moss)}
.tabs svg{width:24px;height:24px}
.screen{display:flex;flex-direction:column;gap:12px}

/* Leaflet (subconjunt mínim de leaflet.css 1.9.4) */
.leaflet-pane,.leaflet-marker-icon,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--f-body)}
.leaflet-container img.leaflet-image-layer{max-width:none!important;max-height:none!important}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-marker-icon,.leaflet-image-layer{user-select:none;-webkit-user-drag:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}

.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-bottom .leaflet-control{margin-bottom:6px}
.leaflet-bar{border-radius:10px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.leaflet-bar a{display:block;width:38px;height:38px;line-height:38px;text-align:center;background:var(--surface);color:var(--ink);text-decoration:none;font:700 20px var(--f-body);border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-control-attribution{background:rgba(255,255,255,.85);padding:1px 6px;font-size:10.5px;color:#444;border-radius:6px}
.leaflet-div-icon{background:none;border:0}

<body>
<div class="app">
  <header class="topbar">
    <img class="logo" src="icons/logo.svg" width="44" height="44" alt="">
    <div class="brand"><h1>Boletus</h1><span class="tag" id="sptag">radar de ceps</span></div><span class="spacer"></span>
    <button class="iconbtn" id="howbtn" aria-label="Com funciona"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </header>
  <div class="spsw" id="spsw" role="group" aria-label="Quin bolet busquem"></div>
  <section class="screen" id="s-inici" hidden></section>
  <section class="screen" id="s-llocs"><p class="small">Carregant…</p></section>
  <section class="screen" id="s-fitxa" hidden></section>
  <section class="screen" id="s-mapa" hidden></section>
  <section class="screen" id="s-com" hidden></section>
  <section class="screen" id="s-buscar" hidden></section>
</div>
<div class="tabs"><nav role="tablist">
  <button role="tab" data-t="inici" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inici</button>
  <button role="tab" data-t="llocs" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Llocs</button>
  <button role="tab" data-t="mapa" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
</nav></div>

<script src="vendor/leaflet.js"></script>
<script>
(async function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('rc3-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('rc3-'+k,JSON.stringify(v))}catch(e){}}};
const DAY=86400000;
const dnum=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/DAY);
const dstr=n=>new Date(n*DAY).toISOString().slice(0,10);
const D=n=>new Date(n*DAY);
const fmt=(n,o)=>D(n).toLocaleDateString('ca-ES',Object.assign({day:'numeric',month:'short',timeZone:'UTC'},o||{}));
const wdn=n=>D(n).toLocaleDateString('ca-ES',{weekday:'short',timeZone:'UTC'}).replace('.','');
const _t=new Date();const TODAY=dnum(`${_t.getFullYear()}-${String(_t.getMonth()+1).padStart(2,'0')}-${String(_t.getDate()).padStart(2,'0')}`);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Dades ---------- */
const j=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
let META,HIST,G,PRIV=null;
try{
  [META,HIST]=await Promise.all([j('data/meta.json'),j('data/hist.json')]);
  const buf=await fetch('data/grid.bin').then(r=>{if(!r.ok)throw new Error('grid');return r.arrayBuffer()});
  const [gw,gh]=META.grid,n=gw*gh;let o=0;const take=(T,b)=>{const a=new T(buf.slice(o,o+n*b));o+=n*b;return a};
  G={gw,gh,elev:take(Uint16Array,2),slope:take(Uint8Array,1),asp:take(Uint16Array,2),sec:take(Uint8Array,1),cov:take(Uint8Array,1),rock:take(Uint8Array,1),rdesc:take(Int16Array,2)};
}catch(e){$('#s-llocs').innerHTML='<div class="card">No s\'han pogut carregar les dades. Torna a obrir l\'app amb connexió.</div>';return}

/* ---------- Llocs i sortides inicials ---------- */
// (els enllaços antics amb #k=... continuen funcionant: la clau ja no cal)
if(/[#&]k=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
try{PRIV=await j('data/llocs.json')}catch(e){$('#s-llocs').innerHTML="<div class='card'>No s'han pogut carregar els llocs. Torna a obrir l'app amb connexió.</div>";return}
const [[S_,W_],[N_,E_]]=META.bounds;const mY=lat=>Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
G.w=W_;G.e=E_;G.ny=mY(N_);G.sy=mY(S_);
const forestSet=new Set(META.forest_ids);
const cellOf=(lat,lng)=>{const x=Math.floor((lng-G.w)/(G.e-G.w)*G.gw),y=Math.floor((G.ny-mY(lat))/(G.ny-G.sy)*G.gh);return(x<0||y<0||x>=G.gw||y>=G.gh)?-1:y*G.gw+x};
const cellLL=i=>{const x=i%G.gw,y=Math.floor(i/G.gw);const my=G.ny-(y+.5)/G.gh*(G.ny-G.sy);return[(2*Math.atan(Math.exp(my))-Math.PI/2)*180/Math.PI,G.w+(x+.5)/G.gw*(G.e-G.w)]};
const DIRS=['nord','nord-est','est','sud-est','sud','sud-oest','oest','nord-oest','pla'];
const coverName=k=>{const s=(META.cover_names[k]||'').replace(/^[\d.]+\s*\(\d+\)\s*/,'');
  return /aciculifolis/.test(s)?'pinar':/esclerofil/.test(s)?'alzinar o suredes':/caducifolis/.test(s)?'roureda':/Matollar/.test(s)?'matolls':/Altres conreus llenyosos/.test(s)?'avellaners o fruiters':/conreus|Oliverars|Vinyes/i.test(s)?'conreus':s.toLowerCase()||'sense dades'};
// Arbres que acompanyen les espècies que busquem: roure, alzina, surera i avellaner
const hazelId=META.cover_names.findIndex(n=>/Altres conreus llenyosos/.test(n));
const goodTree=k=>{const s=META.cover_names[k]||'';return /esclerofil|caducifolis/.test(s)||k===hazelId};

/* ---------- Estadística d'una zona ---------- */
function zoneStats(test,box){
  const st={n:0,forest:0,sec:Array(9).fill(0),elev:0,rock:[0,0,0,0]};
  const c0=cellOf(box[1],box[0]),c1=cellOf(box[3],box[2]);
  if(c0<0||c1<0)return Object.assign(st,{pct:Array(9).fill(0),obaga:0,solana:0,outside:true});
  const xs=[c0%G.gw,c1%G.gw],ys=[Math.floor(c0/G.gw),Math.floor(c1/G.gw)];
  const cells=[];
  for(let y=Math.max(0,Math.min(...ys)-1);y<=Math.min(G.gh-1,Math.max(...ys)+1);y++)for(let x=Math.max(0,Math.min(...xs)-1);x<=Math.min(G.gw-1,Math.max(...xs)+1);x++){const i=y*G.gw+x;if(test(cellLL(i)))cells.push(i)}
  const anyF=cells.some(i=>forestSet.has(G.cov[i]));
  for(const i of cells){const f=forestSet.has(G.cov[i]);st.n++;if(f)st.forest++;if(!anyF||f){st.sec[G.sec[i]]++;st.elev+=G.elev[i];st.rock[G.rock[i]]++}}
  const m=st.sec.reduce((a,b)=>a+b,0)||1;st.pct=st.sec.map(v=>v/m);st.elev=Math.round(st.elev/m);
  st.obaga=st.pct[7]+st.pct[0]+st.pct[1];st.solana=st.pct[3]+st.pct[4]+st.pct[5];return st}
const pip=(p,poly)=>{let c=false;for(let i=0,k=poly.length-1;i<poly.length;k=i++){const[yi,xi]=poly[i],[yk,xk]=poly[k];if(((yi>p[0])!==(yk>p[0]))&&(p[1]<(xk-xi)*(p[0]-yi)/(yk-yi)+xi))c=!c}return c};
const polyStats=poly=>{const la=poly.map(p=>p[0]),lo=poly.map(p=>p[1]);return zoneStats(p=>pip(p,poly),[Math.min(...lo),Math.min(...la),Math.max(...lo),Math.max(...la)])};
const circleStats=(lat,lng,r)=>{const k=Math.cos(lat*Math.PI/180),dl=r/111320,dn=r/(111320*k);return zoneStats(([a,b])=>((a-lat)*111320)**2+((b-lng)*111320*k)**2<=r*r,[lng-dn,lat-dl,lng+dn,lat+dl])};

/* ---------- Sortida del sol ---------- */
function madridOffset(n){const y=D(n).getUTCFullYear();const lastSun=m=>{let d=dnum(`${y}-${m}-31`);while(D(d).getUTCDay()!==0)d--;return d};return(n>=lastSun('03')&&n<lastSun('10'))?2:1}
function sunTimes(n,lat,lon){
  const doy=n-dnum(D(n).getUTCFullYear()+'-01-01')+1,g=2*Math.PI/365*(doy-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const de=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const at=z=>{const ha=Math.acos(Math.cos(z*Math.PI/180)/(Math.cos(lat*Math.PI/180)*Math.cos(de))-Math.tan(lat*Math.PI/180)*Math.tan(de))*180/Math.PI;
    return 720-4*(lon+ha)-eq+madridOffset(n)*60};
  const hm=m=>`${Math.floor(m/60)}:${String(Math.floor(m%60)).padStart(2,'0')}`;
  return{sol:hm(at(90.833)),llum:hm(Math.floor(at(96)/5)*5)}}
const sunIcon=`<svg width="38" height="30" viewBox="0 0 38 30" aria-hidden="true" style="flex:none"><path d="M3 26h32" stroke="var(--ink)" stroke-width="2"/><path d="M10 26a9 9 0 0 1 18 0" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="2.2" stroke-linecap="round"><path d="M19 6v5M8 11l3 3M30 11l-3 3"/></g></svg>`;
const dropSvg=(w,h)=>`<svg width="${w}" height="${h}" viewBox="0 0 20 25" aria-hidden="true"><path d="M10 1C10 1 2 12 2 17a8 8 0 0 0 16 0C18 12 10 1 10 1z" fill="var(--rain)"/></svg>`;

/* ---------- Llocs ---------- */
const SITES=PRIV.sites.concat(store.get('extra',[]));
const spOf=s=>s.sp||['ceps']; // els llocs antics són de ceps
const MINE=()=>SITES.filter(s=>spOf(s).includes(SP));
let zones=store.get('zones',{});
SITES.forEach(s=>{s.zone=zones[s.id]?{kind:'poly',st:polyStats(zones[s.id])}:{kind:'circle',st:circleStats(s.lat,s.lng,600)}});
/* Pluja: l'històric ve amb l'app; els últims dies i la previsió es baixen cada dia */
const histStart=dnum(HIST.start);let histEnd=histStart;
HIST.sites.forEach(h=>{let k=h.r.length-1;while(k>0&&h.r[k]==null)k--;histEnd=Math.max(histEnd,histStart+k)});
let WX={},wxInfo='';
async function loadWX(){
  const today=dstr(TODAY),ck='wx-'+today;let c=store.get(ck,null);
  const need=SITES.filter(s=>!(c&&c[s.id]));
  if(need.length){try{
    const q=(base,extra)=>fetch(`${base}?latitude=${need.map(s=>s.lat.toFixed(4)).join(',')}&longitude=${need.map(s=>s.lng.toFixed(4)).join(',')}&daily=precipitation_sum,temperature_2m_mean,temperature_2m_min&timezone=Europe%2FMadrid${extra}`)
      .then(r=>{if(!r.ok)throw new Error('wx');return r.json()}).then(x=>Array.isArray(x)?x:[x]);
    const live=await q('https://api.open-meteo.com/v1/forecast','&past_days=92&forecast_days=8');
    const gA=histEnd+1,gB=TODAY-93;const gap=gB>=gA?await q('https://historical-forecast-api.open-meteo.com/v1/forecast',`&start_date=${dstr(gA)}&end_date=${dstr(gB)}`):null;
    c=c||{};
    need.forEach((s,i)=>{const o={time:[],r:[],t:[],n:[]};[gap&&gap[i],live[i]].forEach(x=>{if(!x)return;x.daily.time.forEach((d,k)=>{o.time.push(d);o.r.push(x.daily.precipitation_sum[k]);o.t.push(x.daily.temperature_2m_mean[k]);o.n.push(x.daily.temperature_2m_min?x.daily.temperature_2m_min[k]:null)})});c[s.id]=o});
    try{Object.keys(localStorage).filter(k=>k.startsWith('rc3-wx-2')&&k!=='rc3-'+ck).forEach(k=>localStorage.removeItem(k))}catch(e){}
    store.set(ck,c);store.set('wx-last',{d:today,c});
    const nw=new Date();wxInfo=`Pluja actualitzada avui a les ${nw.getHours()}:${String(nw.getMinutes()).padStart(2,'0')}.`;
  }catch(e){const last=store.get('wx-last',null);if(last){c=Object.assign({},last.c,c||{});wxInfo=`Sense connexió: la pluja és del ${fmt(dnum(last.d))}.`}else wxInfo='Sense connexió: no s\'ha pogut baixar la pluja d\'avui.'}}
  else wxInfo='Pluja actualitzada avui.';
  WX=c||{}}
await loadWX();
let NOWF=null;try{NOWF=await j('data/now.json')}catch(e){}
function buildSeries(s){
  const h=HIST.sites.find(x=>x.id===s.id),start=histStart;
  const r=h?h.r.map(v=>v==null?null:v/10):[],t=h?h.t.map(v=>v==null?null:v/10):[],mn=h&&h.n?h.n.map(v=>v==null?null:v/10):[];
  const put=src=>{if(!src)return;src.time.forEach((d,k)=>{const n=dnum(d),i=n-start;if(i<0||(n<=histEnd&&r[i]!=null))return;r[i]=src.r[k];t[i]=src.t[k];if(src.n&&src.n[k]!=null)mn[i]=src.n[k]})};
  put(NOWF&&NOWF.sites.find(x=>x.id===s.id));put(WX[s.id]);
  s.ser={start,r,t,n:mn,end:start+r.length-1}}
SITES.forEach(buildSeries);
const rainOn=(s,d)=>{const v=s.ser.r[d-s.ser.start];return v==null?null:v};
const tempOn=(s,d)=>{const v=s.ser.t[d-s.ser.start];return v==null?null:v};
const wetTxt=(s,d)=>{const r=rainOn(s,d);return r!=null&&r>=1?`<div class="small" style="color:var(--rain);font-weight:700;margin-top:2px">Es preveuen ${Math.round(r)} litres de pluja: porta impermeable.</div>`:(d<=s.ser.end?'<div class="small" style="margin-top:2px">No es preveu pluja.</div>':'')};

/* ---------- Regla (d'exemple; es pot ajustar a "Com funciona") ---------- */
const RULE0={mm:17,span:2,minT:12,wait:16,before:2,after:2,obagaBonus:1};
/* ---------- Espècies: cada una té la seva regla, els seus spots i el seu diari. La dels ceps no canvia. ---------- */
const SPECIES={
  ceps:{nom:'Ceps',chip:'Ceps i ous de reig',tag:'radar de ceps',u:['cep','ceps'],rule0:RULE0,key:'rule4',region:'data/region.json',vells:'Ceps vells',
    nit:"Els ceps surten de nit: com més d'hora hi aneu, més en trobareu.",
    // força: litres (de "poc" a "prou"), temperatura dels dies de creixement (trapezi), pes de cada mes i cost de cada nit de gelada
    forca:{mm:[10,35],t:[12,16,22,27],mes:{5:.3,6:.4,7:.4,8:.6,9:1,10:1,11:.4,12:.1},gel:.2}},
  // Les altres espècies són de pinar: regles provisionals a partir de guies, boletaires i BoletRadar.cat; s'ajustaran amb el diari
  rov:{nom:'Rovellons',chip:'Rovellons',tag:'radar de rovellons',u:['rovelló','rovellons'],key:'rule-rov',region:'data/region_rov.json',vells:'Rovellons vells',
    rule0:{mm:25,span:5,minT:10,maxT:20,wait:12,before:4,after:6,obagaBonus:2,months:[9,10,11,12,1]},
    nit:"Com més d'hora hi aneu, menys gent hi haurà passat abans.",
    forca:{mm:[12,45],t:[6,10,16,20],mes:{9:.7,10:1,11:.95,12:.5,1:.2},gel:.1},
    spot:{alt:[80,300,1300,1750],ob:.8},leg:['Àcida: pinetell','Calcària: rovelló'],soil:{calc:'terra calcària, on va bé el rovelló',acid:'terra àcida, més aviat de pinetell'}},
  // Fredolic, llenega negra i camagroc: surten a la mateixa època i als mateixos pinars, i van junts
  hiv:{nom:"Bolets d'hivern",chip:"Bolets d'hivern",tag:"radar de bolets d'hivern",u:['bolet','bolets'],key:'rule-hiv',region:'data/region_rov.json',vells:'Bolets vells',
    rule0:{mm:22,span:4,minT:3,maxT:15,wait:16,before:5,after:8,obagaBonus:2,months:[10,11,12,1,2]},

function icgcNom(c){

  if(/esclerof/i.test(c))return['go',`Sí, és bosc${clar}: alzines o suros`];
  if(/caducif/i.test(c))return['go',`Sí, és bosc${clar}: roures, faigs o castanyers`];
  if(/^bosc|ribera/i.test(c))return['go','Sí, és bosc'];

  return['no','No és bosc: '+c.charAt(0).toLowerCase()+c.slice(1)]}

     <p><strong>Bona</strong> (60 o més), <strong>normal</strong> (35–59) o <strong>fluixa</strong> (menys de 35).${SP==='ceps'?` Amb les vostres sortides: la tanda del 2 d'octubre (8 ceps) treu 100, la del 2022 (20 ceps) 46, i la del 18 d'octubre (0 ceps el 31) només 24, perquè va créixer amb 14 °C i ja de novembre.`:' Encara no hi ha sortides de rovellons per comprovar-ho.'}</p></div>
   <div class="card how"><h3>D'on surt la pluja</h3>
     <p>Pluja estimada per a cada lloc, de models d'alta resolució (d'1 a 3 km), via Open-Meteo. Cada cop que obres l'app es baixen els últims dies i la previsió de 7 dies; sense connexió es fa servir l'última que tenies. Al calendari de cada lloc pots tirar enrere fins al 2016 per veure si la regla hauria encertat.</p></div>
   <div class="card how"><h3>Ajustar la regla</h3>
     <p class="small">Mou els números i mira als calendaris si els dies verds coincideixen amb els dies que vau trobar ${SPECIES[SP].u[1]}.</p>
     ${[['mm','Pluja mínima','l',10,80],['span','En quants dies','dies',1,7],['minT','Temperatura mínima després de la pluja','°C',0,22],...(RULE.maxT!=null?[['maxT','Temperatura màxima després de la pluja','°C',8,28]]:[]),['wait','Millor dia (dies després de la pluja)','dies',5,30],['before','Marge abans','dies',0,7],['after','Marge després','dies',0,10],['obagaBonus','Dies extra si és obaga','dies',0,6]]
       .map(([k,l,u,a,b])=>`<div class="slider"><label for="r-${k}">${l}</label><output id="o-${k}">${RULE[k]} ${u}</output><input type="range" id="r-${k}" data-k="${k}" data-u="${u}" min="${a}" max="${b}" value="${RULE[k]}"></div>`).join('')}
     <button class="btn ghost" id="rreset" style="align-self:flex-start">Tornar a la regla provisional</button></div>`;
  $('#s-com').querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{RULE[inp.dataset.k]=+inp.value;$('#o-'+inp.dataset.k).textContent=inp.value+' '+inp.dataset.u;store.set(SPECIES[SP].key,RULE);SITES.forEach(evalSite)});
  $('#rreset').onclick=()=>{store.set(SPECIES[SP].key,{});RULE=loadRule();SITES.forEach(evalSite);renderCom()}}

/* ---------- INICI: què busquem avui ---------- */
// Resum d'una espècie amb els seus llocs (es calcula amb la seva regla i després es torna a la de l'espècie triada)
function spSummary(k){
  const keep=SP;SP=k;RULE=loadRule();const L=MINE();L.forEach(evalSite);
  const go=L.filter(s=>s.state==='go'),soon=L.filter(s=>s.state==='soon');
  const best=(go.length?go:soon).filter(s=>s.win&&s.win.f).sort((a,b)=>b.win.f.v-a.win.f.v)[0]||null;
  const mes=(SPECIES[k].forca.mes||{})[new Date().getMonth()+1]||0;
  const r={k,n:L.length,go:go.length,soon:soon.length,best:best&&{name:best.name,f:best.win.f,win:best.win,state:best.state},mes,
    pts:(go.length?3:soon.length?2:0)+(best?best.win.f.v/100:0)+mes+({ceps:.3,rov:.2}[k]||0)};
  SP=keep;RULE=loadRule();SITES.forEach(evalSite);return r}
let iniSel=null;
function renderInici(){
  const S=SHOW.map(spSummary),H=spSummary('hiv');
  const reco=[...S].sort((a,b)=>b.pts-a.pts)[0];
  if(!iniSel||!SPECIES[iniSel])iniSel=reco.k;const x=S.find(v=>v.k===iniSel),N=SPECIES[x.k].nom;
  const st=v=>v.go?['go','Vés-hi']:v.soon?['soon','Aviat']:!v.mes?['','Fora de temporada']:['','Encara no'];
  const tag=x.k===reco.k&&(x.go||x.soon)?'<span class="chip s-go" style="margin-right:6px">Ara toca</span>':'';
  const det0=!x.n?`Encara no teniu cap lloc de <b>${N.toLowerCase()}</b>: busqueu-ne al mapa.`
    :x.go?`<b>${N}</b>: bolets a ${x.go} de ${x.n} llocs${x.best?` · el millor, <b>${esc(x.best.name)}</b> (tanda ${x.best.f.nom})`:''}.`
    :x.soon?`<b>${N}</b>: aviat, el ${wdn(x.best.win.peak)} ${fmt(x.best.win.peak)} a <b>${esc(x.best.name)}</b>.`
    :!x.mes?`<b>${N}</b>: ara no és temporada.`:`<b>${N}</b>: encara falta aigua als vostres llocs.`;
  const d=new Date(),hora=d.getHours();
  $('#s-inici').innerHTML=`<div class="ini">
   <div class="hero"><h2>${hora<13?'Bon dia':hora<20?'Bona tarda':'Bona nit'}! Què busquem?</h2><span class="small">${d.toLocaleDateString('ca-ES',{weekday:'short',day:'numeric',month:'short'})}</span></div>
   <span class="segl">Quin bolet?</span>
   <div class="seg" role="radiogroup" aria-label="Quin bolet">${S.map(v=>`<button class="sq ${v.mes?'':'off'}" role="radio" data-k="${v.k}" data-inisel="${v.k}" aria-checked="${v.k===x.k}">${v.go||v.soon?`<i class="dot ${v.go?'':'soon'}"></i>`:''}${spIcon(28,v.k)}<span class="nm">${SPECIES[v.k].nom}</span></button>`).join('')}</div>
   <div class="inidet">${tag}${det0}</div>
   <div class="modes">
     <button class="mode" data-goinici="${x.k}" data-to="llocs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span><b>Els meus llocs</b><small>${x.n} ${x.n===1?'lloc':'llocs'} amb el calendari</small></span></button>
     <button class="mode alt" data-goinici="${x.k}" data-to="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span><b>Mapa</b><small>On hi ha bolets ara</small></span></button>
   </div>
   <p class="altres">Altres bolets (no els busquem): bolets d'hivern ${H.go?`a ${H.go} de ${H.n} llocs`:H.soon?'aviat':!H.mes?'fora de temporada':'encara no'}.</p>
   <button class="inilink" data-howinici>Com funciona l'app</button></div>`}
// Preu a Mercabarna (es desa cada matí): el darrer dia i com ha anat aquella setmana
let MKT=null;
async function paintMkt(){
  if(!MKT){try{MKT=await fetch('data/mercat.json',{cache:'no-cache'}).then(r=>r.json())}catch(e){MKT={dies:{}}}}
  const ds=Object.keys(MKT.dies||{}).sort(),el=$('#mkt');if(!el||!ds.length)return;
  const d=ds[ds.length-1],R=MKT.dies[d],nom=k=>/sense determinar/i.test(k)?'Bolets de bosc (barrejats)':k.replace(/^Bolets /,'').replace(/^./,c=>c.toUpperCase());
  const ks=Object.keys(R).filter(k=>!/xampiny|g[ií]rgol/i.test(k));if(!ks.length)return;
  const prev=ds.slice(0,-1).reverse().find(x=>MKT.dies[x][ks[0]]),tr=prev?R[ks[0]][0]-MKT.dies[prev][ks[0]][0]:0;
  el.innerHTML=`<span class="lbl">Mercat · Mercabarna, ${fmt(dnum(d))}</span>${ks.map(k=>`<span><b>${esc(nom(k))}</b> ${R[k][0].toLocaleString('ca-ES')} €/kg <span class="muted">(${R[k][2]}–${R[k][1]})</span></span>`).join('')}${tr?`<span class="muted">${tr>0?'▲ ha pujat':'▼ ha baixat'} ${Math.abs(tr)} € des del ${fmt(dnum(prev))}</span>`:''}`}

/* ---------- Navegació ---------- */
let mapBuilt=false,lastTab='llocs',screen='llocs';
function show(t){
  screen=t;document.body.dataset.screen=t;
  document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!=='s-'+t);
  if(t==='inici')renderInici();
  if(t==='llocs'||t==='mapa'||t==='inici'){lastTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t))}
  if(t==='llocs')renderLlocs();
  if(t==='mapa'){const first=!mapBuilt;if(!mapBuilt){buildMap();mapBuilt=true}else drawPins();setTimeout(()=>{map.invalidateSize();if(first&&!L1.moved)L1.fit()},30)}
  if(t==='com')renderCom();
  if(t==='buscar')renderBuscar();
  window.scrollTo(0,0)}
function setSpecies(k){
  if(!SPECIES[k])return;SP=k;store.set('sp',k);RULE=loadRule();SITES.forEach(evalSite);form=null;
  document.querySelectorAll('[data-sp]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sp===k));
  $('#sptag').textContent=SPECIES[k].tag;document.documentElement.dataset.species=k;
  {const b=$('#spsw [aria-pressed=true]');if(b&&b.scrollIntoView)try{b.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
  if(mapBuilt)drawPins();
  if(mapBuilt){if(tap){map.removeLayer(tap);tap=null}$('#mapcard').innerHTML='';region().then(drawSpots);drawProb()}
  if(screen==='fitxa')renderFitxa();else show(screen)}
$('#spsw').innerHTML=SHOW.map(k=>`<button data-sp="${k}" aria-pressed="${k===SP}">${spIcon(24,k)}${SPECIES[k].chip}</button>`).join('');
setSpecies(SP);
document.addEventListener('click',e=>{
  const spb=e.target.closest('[data-sp]');if(spb){setSpecies(spb.dataset.sp);return}
  const os=e.target.closest('[data-onsoc]');if(os){if(!navigator.geolocation){$('#mapcard').innerHTML='<p>Aquest mòbil no deixa saber on ets.</p>';return}os.classList.add('busy');
    navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];os.classList.remove('busy');L1.moved=true;map.setView(ll,12);
      if(L1.me)map.removeLayer(L1.me);L1.me=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2F67A6',fillOpacity:1}).addTo(map)},
      ()=>{os.classList.remove('busy');$('#mapcard').innerHTML="<p>No s'ha pogut saber on ets. Mira que el mòbil deixi fer servir la ubicació.</p>"},{enableHighAccuracy:true,timeout:15000});return}
  if(e.target.closest('[data-mclose]')){$('#mapcard').innerHTML='';if(tap){map.removeLayer(tap);tap=null}return}
  const cp=e.target.closest('[data-capes]');if(cp){const pn=$('#s-mapa .laypanel');pn.hidden=!pn.hidden;cp.setAttribute('aria-expanded',!pn.hidden);return}
  const isel=e.target.closest('[data-inisel]');if(isel){iniSel=isel.dataset.inisel;renderInici();return}
  const gi=e.target.closest('[data-goinici]');if(gi){setSpecies(gi.dataset.goinici);show(gi.dataset.to);return}
  if(e.target.closest('[data-gomap]')){show('mapa');return}
  const t=e.target.closest('.tabs button');if(t){show(t.dataset.t);return}
  if(e.target.closest('#howbtn')||e.target.closest('[data-howinici]')){show('com');return}
  const o=e.target.closest('[data-open]');if(o){openSite(o.dataset.open,o.dataset.from);return}
  if(e.target.closest('[data-back]')){show(screen==='fitxa'?cur.from:lastTab);return}
  const dy=e.target.closest('[data-day]');if(dy){selDay=+dy.dataset.day;$('#s-fitxa').querySelectorAll('.day.sel').forEach(x=>x.classList.remove('sel'));dy.classList.add('sel');$('#daynote').innerHTML=dayNote(cur,selDay);return}
  const cb=e.target.closest('[data-cal]');if(cb&&!cb.disabled){calOff=Math.min(0,calOff+ +cb.dataset.cal);renderFitxa();return}
  if(e.target.closest('[data-newvisit]')){const now=new Date();form={d:dstr(TODAY),n:0,h:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,est:[],nota:''};renderFitxa();return}
  if(e.target.closest('[data-cancel]')){form=null;renderFitxa();return}
  if(e.target.closest('[data-save]')){visits.push({d:$('#fdate').value||dstr(TODAY),site:cur.id,sp:SP,n:form.n,h:$('#fh').value,est:form.est,nota:$('#fnota').value.trim()});saveVisits();form=null;renderFitxa();return}
  if(e.target.closest('[data-showmap]')){const s=cur;L1.moved=true;show('mapa');setTimeout(()=>{map.invalidateSize();map.setView([s.lat,s.lng],15);pinCard(s)},60);return}
  const ah=e.target.closest('[data-addhere]');if(ah){const[la,lo]=ah.dataset.addhere.split(',').map(Number);
    $('#mapcard').innerHTML=`<strong>Lloc nou</strong><form id="addf" class="sheet"><div><label for="addn">Nom</label><input id="addn" maxlength="40" required style="font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;box-sizing:border-box"></div><button class="btn">Desa el lloc</button></form><p class="small">Es guarda en aquest mòbil.</p>`;
    $('#addn').focus();$('#addf').onsubmit=ev=>{ev.preventDefault();const ex=store.get('extra',[]);ex.push({sp:[SP],id:'x'+Date.now().toString(36),name:$('#addn').value.trim()||'Lloc nou',muni:'',lat:la,lng:lo});store.set('extra',ex);store.set('obre','llocs');location.reload()};return}
  const dl=e.target.closest('[data-delsite]');if(dl){if(dl.dataset.sure){store.set('extra',store.get('extra',[]).filter(x=>x.id!==dl.dataset.delsite));location.reload()}else{dl.dataset.sure='1';dl.textContent='Toca un altre cop per esborrar-lo'}return}
  if(e.target.closest('[data-avisosobre]')){avisosObert=true;renderLlocs();$('#avisos').scrollIntoView({behavior:'smooth',block:'nearest'});return}
  if(e.target.closest('[data-avisosreset]')){store.set('avisosOk',false);avisosObert=true;show('llocs');return}
  if(e.target.closest('[data-avisosok]')){store.set('avisosOk',true);renderLlocs();return}
  const ct=e.target.closest('[data-copytema]');if(ct){(navigator.clipboard?navigator.clipboard.writeText(AVIS_TEMA):Promise.reject()).then(()=>{ct.textContent='Copiat'}).catch(()=>{ct.textContent=AVIS_TEMA});return}
  const bq=e.target.closest('[data-bq]');if(bq){BQ[bq.dataset.bq]=bq.dataset.v;store.set('buscar',BQ);renderBuscar();return}
  const hm=e.target.closest('[data-home]');if(hm){if(hm.dataset.home==='reset'){store.set('home',null);renderBuscar()}else if(navigator.geolocation){hm.textContent='Buscant…';navigator.geolocation.getCurrentPosition(p=>{store.set('home',{nom:'on ets ara',lat:p.coords.latitude,lng:p.coords.longitude});renderBuscar()},()=>{hm.textContent='No s\'ha pogut'},{timeout:15000})}return}
  const zm=e.target.closest('[data-zmap]');if(zm){const z=REG.zones[+zm.dataset.zmap];L1.moved=true;show('mapa');setTimeout(async()=>{map.invalidateSize();map.setView([z.lat,z.lng],15);await toggleSim(null,true);
    if(tap)map.removeLayer(tap);tap=L.marker([z.lat,z.lng],{icon:L.divIcon({className:'',html:'<div class="tapmark"></div>',iconSize:[14,14],iconAnchor:[7,7]}),interactive:false}).addTo(map);
    $('#mapcard').innerHTML=`<strong>Zona de ${z.ha} ha</strong><p class="small">${Math.round(z.ob*100)}% obaga · ${Math.round(z.so*100)}% solana · ${z.arbre} · ${z.alt} m</p><div class="row"><a class="btn ghost" href="${gmDir(z.lat,z.lng)}" target="_blank" rel="noopener">Com arribar-hi</a><button class="btn ghost" data-zadd="${zm.dataset.zmap}">Afegir als meus llocs</button></div>`},80);return}
  const za=e.target.closest('[data-zadd]');if(za){const z=REG.zones[+za.dataset.zadd];const H=store.get('home',null)||REG.home;const ex=store.get('extra',[]);
    ex.push({sp:[SP],id:'x'+Date.now().toString(36),name:`Zona a ${distKm(H.lat,H.lng,z.lat,z.lng).toFixed(0)} km (${bearing(H.lat,H.lng,z.lat,z.lng)})`,muni:'',lat:z.lat,lng:z.lng});store.set('extra',ex);store.set('obre','llocs');location.reload();return}
  const dr=e.target.closest('[data-draw]');if(dr){const s=SITES.find(x=>x.id===dr.dataset.draw);map.setView([s.lat,s.lng],15);startDraw(s.id);return}
});
show(store.get('obre','')==='llocs'?'llocs':'inici');store.set('obre','');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
