<!doctype html>
<html lang="ca"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boletus</title>
<meta name="description" content="Quan anar a buscar ceps, ous de reig, rovellons, fredolics, llenegues i camagrocs, amb la pluja de cada dia.">
<meta name="theme-color" content="#132417">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boletus">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dues pestanyes (Llocs, Mapa). Cada lloc s'obre en una fitxa amb el calendari d'un mes: aigua en blau, dies de bolets en verd */
:root{
  --bg:#E9EDE2; --surface:#F8FAF3; --surface2:#EFF2E8; --ink:#1C2218; --muted:#5D6655; --line:#D0D7C4;
  --moss:#3E5B2B; --on-moss:#F8FAF3;
  --go:#2E8B4B; --go-soft:#CDEBD5; --soon:#A86F08; --soon-soft:#F6E7C6; --wait:#7E857A; --wait-soft:#E3E6DE;
  --rain:#2F67A6; --rain-soft:#D6E5F4; --obaga:#3468C8; --solana:#E88430; --cep:#7A4A2A; --sun:#D98A0B;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10140D; --surface:#192015; --surface2:#222B1D; --ink:#E5EADD; --muted:#9BA591; --line:#2F3A28;
  --moss:#A3C982; --on-moss:#14190F;
  --go:#5FC683; --go-soft:#1F4A2C; --soon:#E6AD45; --soon-soft:#3A2E14; --wait:#868E7F; --wait-soft:#262B22;
  --rain:#7FB0E0; --rain-soft:#1D2D3D; --cep:#D9A57E; --sun:#F0B54A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10140D; --surface:#192015; --surface2:#222B1D; --ink:#E5EADD; --muted:#9BA591; --line:#2F3A28;
  --moss:#A3C982; --on-moss:#14190F;
  --go:#5FC683; --go-soft:#1F4A2C; --soon:#E6AD45; --soon-soft:#3A2E14; --wait:#868E7F; --wait-soft:#262B22;
  --rain:#7FB0E0; --rain-soft:#1D2D3D; --cep:#D9A57E; --sun:#F0B54A; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;padding-block:14px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
body{padding-top:env(safe-area-inset-top,0px)}
a.btn{text-decoration:none;text-align:center;display:inline-block}
.coords{font-family:var(--f-data);font-size:13px;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.small{font-size:13.5px;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:8px;min-height:40px}
.topbar h1{font-size:22px;font-weight:700;line-height:1;font-style:italic;letter-spacing:-.03em}
.brand{display:flex;flex-direction:column;gap:3px}
:root{--acc:#8A5530;--acc-soft:rgba(138,85,48,.14)}
:root[data-species="rov"]{--acc:#E2701F;--acc-soft:rgba(226,112,31,.16)}
:root[data-species="hiv"]{--acc:#6F8499;--acc-soft:rgba(111,132,153,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--acc:#D9A57E;--acc-soft:rgba(217,165,126,.13)}
  :root:not([data-theme="light"])[data-species="rov"]{--acc:#F39A4C;--acc-soft:rgba(243,154,76,.15)}
  :root:not([data-theme="light"])[data-species="hiv"]{--acc:#A9BBCB;--acc-soft:rgba(169,187,203,.14)}}
body{background-image:radial-gradient(120% 60% at 50% -10%,var(--acc-soft),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;transition:background-color .3s}
/* Capçalera: nom, quin bolet (ceps o rovellons) i "com funciona" */
.sptog{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);transition:opacity .2s}
.sptog button{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--muted);font:700 13.5px var(--f-body);padding:4px 11px 4px 5px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.sptog button svg{width:22px;height:22px;flex:none;filter:saturate(.25) opacity(.6);transition:filter .2s,transform .25s}
.sptog button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sptog button[aria-pressed=true] svg{filter:none;transform:rotate(-6deg)}
body[data-screen=diari] .sptog,body[data-screen=ruta] .sptog,body[data-screen=com] .sptog{opacity:0;pointer-events:none}
.logo-wrap{position:relative;width:44px;height:44px;flex:none}
.logo-wrap .logo{position:absolute;inset:0;transition:opacity .35s,transform .35s}
.logo-wrap .logo.off{opacity:0;transform:scale(.8) rotate(-8deg)}
.brand .tag{color:var(--acc)!important;transition:color .3s}
.empty{align-items:center;text-align:center;padding:26px 18px;gap:12px}
.empty h3{font-size:22px}
.empty svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.brand .tag{font-size:13px;color:var(--muted);font-weight:600}
.logo{flex:none;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--moss);color:var(--on-moss);font-family:var(--f-display);font-size:17px}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-family:var(--f-body);font-size:15px;font-weight:700;padding:9px 13px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;border-radius:999px;padding:4px 11px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-go{color:var(--go);background:var(--go-soft)} .s-soon{color:var(--soon);background:var(--soon-soft)} .s-wait{color:var(--wait);background:var(--wait-soft)}

/* Sol */
.sun{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(240,181,74,.18),transparent 55%),var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.sun strong{font-family:var(--f-display);font-size:18px}

/* Llista de llocs */
.spot{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--acc-soft),transparent 38%),var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.spot .mark{position:absolute;right:-10px;bottom:-12px;opacity:.07;pointer-events:none;transform:rotate(-12deg)}
.spot>*{position:relative}
.spot .name{font-family:var(--f-display);font-weight:700;font-size:21px}
.spot .what{font-size:15.5px}
.strip{display:grid;grid-template-columns:repeat(21,1fr);gap:2px;align-items:end;width:100%}
.strip i{display:block;height:14px;border-radius:3px;background:var(--surface2);position:relative}
.strip i.b{background:var(--go-soft);box-shadow:inset 0 0 0 1.5px var(--go)}
.strip i.p{background:var(--go)}
.strip i.t{outline:2px solid var(--ink);outline-offset:1px}
.strip i u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--rain);text-decoration:none;box-shadow:0 0 0 1.5px var(--surface)}
.strip i u.f{opacity:.5}
.striplab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);width:100%}
.last{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* Fitxa */
.back{background:none;border:0;padding:0;color:var(--moss);font-weight:700;align-self:flex-start;font-size:16px}
.big{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.08}
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h3{font-size:18px;flex:1;text-align:center}
.cal-head button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:18px}
.cal-head button:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.day{position:relative;aspect-ratio:1/1.34;border-radius:10px;background:var(--surface2);border:0;padding:3px 0 0;display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:0}
.fchip{display:inline-block;font-weight:700;font-size:12.5px;border-radius:999px;padding:2px 9px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.f-bona{background:#8A5530;color:#fff}.f-normal{background:#C79A6A;color:#2C2218}.f-fluixa{background:#EADFD0;color:#2C2218;box-shadow:inset 0 0 0 1px rgba(62,36,16,.18)}
.fbar{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:14px}
.fbar i{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:block}.fbar i b{display:block;height:100%;border-radius:4px;background:var(--go)}
.day .tm{font:500 10px/1.15 var(--f-data);color:var(--muted)}
.day .tm.cold{color:#5B9BE0;font-weight:700}.day .tm.hot{color:#E8843A;font-weight:700}.day .tm.f{opacity:.6}
.day.top .tm{color:#fff;opacity:.9}
.day.cx{box-shadow:inset 0 0 0 1.5px #5B9BE0;background-image:repeating-linear-gradient(135deg,rgba(91,155,224,.16) 0 4px,transparent 4px 8px)}
.day .n{font-weight:700;line-height:1.1}
.day.bol{background:var(--go-soft)}
.day.bol .n{color:var(--go)}
.day.s1{background:#EADFD0;box-shadow:inset 0 0 0 1px rgba(62,36,16,.16)}.day.s2{background:#C79A6A}.day.s3{background:#8A5530}
.day.s1 .n,.day.s2 .n{color:#2C2218}.day.s1 .tm,.day.s2 .tm{color:#2C2218;opacity:.7}.day.s3 .n,.day.s3 .tm{color:#fff}.day.s3 .tm{opacity:.85}
.day.hs .n{align-self:flex-start;margin-left:5px}
.day .sc{position:absolute;right:3px;top:4px;font:500 9px/1 var(--f-data);color:#2C2218}.day .sc.lo{color:var(--muted);opacity:.8}.day.s3 .sc,.day.top .sc{color:#fff}
.strip i.b.s1{background:#EADFD0;box-shadow:inset 0 0 0 1px rgba(62,36,16,.2)}.strip i.b.s2{background:#C79A6A;box-shadow:none}.strip i.b.s3{background:#8A5530;box-shadow:none}.strip i.p{background:#3E2410}
.day.top{background:#3E2410}
.day.top .n{color:#fff}
.day.top .drop{opacity:1;filter:brightness(2.2)}
.day.top .drop span{color:#fff}
.day.out{opacity:.4}
.day.today{outline:2.5px solid var(--ink);outline-offset:1px}
.day.sel{box-shadow:0 0 0 3px var(--moss) inset}
.day .drop{display:flex;flex-direction:column;align-items:center;margin-top:auto;margin-bottom:3px;line-height:1}
.day .drop span{font-family:var(--f-data);font-size:10px;color:var(--rain);font-weight:500}
.day .drop.f{opacity:.5}
.day .c{position:absolute;top:-5px;right:-4px;z-index:1;box-shadow:0 0 0 2px var(--surface);font-size:9.5px;font-weight:700;color:#fff;background:var(--acc);border-radius:999px;min-width:15px;height:15px;line-height:15px;text-align:center;padding:0 2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block;flex:none}
.daynote{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:15px}
.facebar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.facebar i{display:block;height:100%}

/* Diari */
.sheet{display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepper button{width:46px;height:46px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:24px;font-weight:700}
.stepper output{font-family:var(--f-display);font-size:46px;font-weight:700;min-width:70px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.opt[aria-pressed="true"]{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
input[type=time],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px;box-sizing:border-box;width:100%}
.visit{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.visit:first-of-type{border-top:0;padding-top:0}

/* Mapa */
.mapbox{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
#map{width:100%;height:calc(100vh - 250px);height:calc(100dvh - 250px);min-height:420px;max-height:900px;background:#9DA6AA}
/* Mapa: botons rodons, panell de capes i fitxa que surt per sobre del mapa */
.mapctl{position:absolute;right:10px;bottom:22px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.rbtn{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(25,32,21,.9);color:#E5EADD;box-shadow:0 2px 8px rgba(0,0,0,.45);font-size:20px}
.rbtn[aria-expanded=true]{background:#A3C982;color:#14190F}
.rbtn.busy{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.5}}
.laypanel{position:absolute;right:66px;bottom:22px;z-index:1000;width:min(250px,calc(100% - 90px));background:rgba(25,32,21,.95);color:#E5EADD;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.laypanel .opt{background:rgba(255,255,255,.08);color:#E5EADD;border-color:rgba(255,255,255,.18);text-align:left}
.laypanel .opt[aria-pressed="true"]{background:#A3C982;color:#14190F;border-color:#A3C982}
.laypanel label{color:#B9C3AE;margin:4px 0 0}
.laypanel select{font:inherit;font-size:15px;color:#14190F;background:#E5EADD;border:0;border-radius:10px;padding:8px}
#mapcard.msheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:1100;max-height:58%;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.5);border-radius:18px;padding-top:16px}
#mapcard.msheet:not(.open){display:none}
.mclose{position:sticky;top:0;align-self:flex-end;flex:none;margin:-8px -4px -30px 0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:16px;z-index:2}
.mapbox.has-sheet .mapctl,.mapbox.has-sheet .laypanel{display:none}
.mapkey{pointer-events:auto;cursor:pointer}
.mapkey.mini span{display:none}
.mapkey.mini::before{content:"Llegenda ▾";font-weight:700}
.mview{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px}
.mview button{border:0;background:transparent;color:var(--muted);font:800 14px var(--f-display);padding:8px 4px;border-radius:999px}
.mview button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--acc)}
.maphint{font-size:13px;color:var(--muted);text-align:center}
/* Llocs i Aquí: una frase gran que ho diu tot, i a sota la llista */
html{touch-action:manipulation}
.muted{color:var(--muted);font-weight:500}
.intro{padding:10px 2px 2px}
.kicker{font:600 14px var(--f-body);color:var(--muted)}
.lead{font:800 31px/1.06 var(--f-display);letter-spacing:-.03em;margin-top:8px}
.lead em{font-style:normal;color:var(--acc)}
.sub{color:var(--muted);font-size:15px;margin-top:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.site{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;align-items:baseline;width:100%;box-sizing:border-box;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 16px 15px;color:inherit;font:inherit}
.site:first-child{border-top:0}
button.site:active{background:var(--surface2)}
.site .nm{display:flex;align-items:center;gap:7px;font:700 18px/1.2 var(--f-display);letter-spacing:-.01em;min-width:0}
.site .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .nm svg{width:24px;height:24px;flex:none}
.site .when{font:800 19px/1.2 var(--f-display);text-align:right;white-space:nowrap}
.site .mu,.site .st{font-size:13px;color:var(--muted)}
.site .st{text-align:right;white-space:nowrap}
.site.go .when{color:var(--ink)}.site.soon .when{color:var(--soon)}.site.wait .when{color:var(--wait);font-weight:600}
.site .strip{grid-column:1/-1;margin-top:11px}
.foot{font-size:12.5px;color:var(--muted);padding:0 4px;line-height:1.5}
.foot i.k{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 1px}
.nota{display:inline-block;min-width:30px;padding:0 6px;box-sizing:border-box;height:24px;line-height:24px;border-radius:12px;font:500 13px var(--f-data);text-align:center;margin-right:8px;vertical-align:3px}
.n-bona{background:#8A5530;color:#fff}.n-normal{background:#C79A6A;color:#2C2218}.n-fluixa{background:#EADFD0;color:#2C2218;box-shadow:inset 0 0 0 1px rgba(62,36,16,.18)}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px 16px;display:flex;flex-direction:column;gap:6px}
.mem h3{font-size:22px;letter-spacing:-.02em}
.mem .cnt{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:700;font-size:16px}
.mem .cnt svg{width:22px;height:22px;vertical-align:-5px;margin-right:4px}
.mem .nt{color:var(--muted);font-size:14.5px}
.mem.zero .cnt{color:var(--muted)}
.mem .linkbtn{padding:2px 0}
.memact{display:flex;gap:16px;align-items:center;margin-top:2px}
.mem .amb{font-size:15px}
.ph{position:relative;display:grid;gap:3px;border-radius:14px;overflow:hidden;margin:-3px -4px 6px;grid-template-columns:1fr 1fr}
.ph img{width:100%;height:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.ph.n1 img{aspect-ratio:4/3;grid-column:1/-1}
.ph.n3 img:first-child{grid-column:1/-1;aspect-ratio:2/1}
.ph .more{position:absolute;right:0;bottom:0;width:calc(50% - 1.5px);aspect-ratio:1;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font:800 24px var(--f-display);pointer-events:none}
.lbox{position:fixed;inset:0;z-index:3000;background:rgba(8,10,6,.94);display:grid;place-items:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.lbox img{max-width:100%;max-height:100%;object-fit:contain}
.lbn{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#ddd;font:500 13px var(--f-data)}
.planbtn{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(120deg,var(--acc-soft),transparent 70%),var(--surface);border-radius:18px;padding:12px 16px;color:var(--ink)}

  <button role="tab" data-t="llocs" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Els meus llocs</button>

  <button role="tab" data-t="mapa" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>

<script src="vendor/leaflet.js"></script>
<script>
(async function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('rc3-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('rc3-'+k,JSON.stringify(v))}catch(e){}}};
const DAY=86400000;
const dnum=s=>Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/DAY);
const dstr=n=>new Date(n*DAY).toISOString().slice(0,10);
const D=n=>new Date(n*DAY);
const fmt=(n,o)=>D(n).toLocaleDateString('ca-ES',Object.assign({day:'numeric',month:'short',timeZone:'UTC'},o||{}));
const wdn=n=>D(n).toLocaleDateString('ca-ES',{weekday:'short',timeZone:'UTC'}).replace('.','');
const _t=new Date();const TODAY=dnum(`${_t.getFullYear()}-${String(_t.getMonth()+1).padStart(2,'0')}-${String(_t.getDate()).padStart(2,'0')}`);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Dades ---------- */
const j=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
let META,HIST,G,PRIV=null;
try{
  [META,HIST]=await Promise.all([j('data/meta.json'),j('data/hist.json')]);
  const buf=await fetch('data/grid.bin').then(r=>{if(!r.ok)throw new Error('grid');return r.arrayBuffer()});
  const [gw,gh]=META.grid,n=gw*gh;let o=0;const take=(T,b)=>{const a=new T(buf.slice(o,o+n*b));o+=n*b;return a};
  G={gw,gh,elev:take(Uint16Array,2),slope:take(Uint8Array,1),asp:take(Uint16Array,2),sec:take(Uint8Array,1),cov:take(Uint8Array,1),rock:take(Uint8Array,1),rdesc:take(Int16Array,2)};
}catch(e){$('#s-llocs').innerHTML='<div class="card">No s\'han pogut carregar les dades. Torna a obrir l\'app amb connexió.</div>';return}

/* ---------- Llocs i sortides inicials ---------- */
// (els enllaços antics amb #k=... continuen funcionant: la clau ja no cal)
if(/[#&]k=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
try{PRIV=await j('data/llocs.json')}catch(e){$('#s-llocs').innerHTML="<div class='card'>No s'han pogut carregar els llocs. Torna a obrir l'app amb connexió.</div>";return}
const [[S_,W_],[N_,E_]]=META.bounds;const mY=lat=>Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
G.w=W_;G.e=E_;G.ny=mY(N_);G.sy=mY(S_);
const forestSet=new Set(META.forest_ids);
const cellOf=(lat,lng)=>{const x=Math.floor((lng-G.w)/(G.e-G.w)*G.gw),y=Math.floor((G.ny-mY(lat))/(G.ny-G.sy)*G.gh);return(x<0||y<0||x>=G.gw||y>=G.gh)?-1:y*G.gw+x};
const cellLL=i=>{const x=i%G.gw,y=Math.floor(i/G.gw);const my=G.ny-(y+.5)/G.gh*(G.ny-G.sy);return[(2*Math.atan(Math.exp(my))-Math.PI/2)*180/Math.PI,G.w+(x+.5)/G.gw*(G.e-G.w)]};
const DIRS=['nord','nord-est','est','sud-est','sud','sud-oest','oest','nord-oest','pla'];
const coverName=k=>{const s=(META.cover_names[k]||'').replace(/^[\d.]+\s*\(\d+\)\s*/,'');
  return /aciculifolis/.test(s)?'pinar':/esclerofil/.test(s)?'alzinar o suredes':/caducifolis/.test(s)?'roureda':/Matollar/.test(s)?'matolls':/Altres conreus llenyosos/.test(s)?'avellaners o fruiters':/conreus|Oliverars|Vinyes/i.test(s)?'conreus':s.toLowerCase()||'sense dades'};
// Arbres que acompanyen les espècies que busquem: roure, alzina, surera i avellaner
const hazelId=META.cover_names.findIndex(n=>/Altres conreus llenyosos/.test(n));
const goodTree=k=>{const s=META.cover_names[k]||'';return /esclerofil|caducifolis/.test(s)||k===hazelId};

/* ---------- Estadística d'una zona ---------- */
function zoneStats(test,box){
  const st={n:0,forest:0,sec:Array(9).fill(0),elev:0,rock:[0,0,0,0]};
  const c0=cellOf(box[1],box[0]),c1=cellOf(box[3],box[2]);
  if(c0<0||c1<0)return Object.assign(st,{pct:Array(9).fill(0),obaga:0,solana:0,outside:true});
  const xs=[c0%G.gw,c1%G.gw],ys=[Math.floor(c0/G.gw),Math.floor(c1/G.gw)];
  const cells=[];
  for(let y=Math.max(0,Math.min(...ys)-1);y<=Math.min(G.gh-1,Math.max(...ys)+1);y++)for(let x=Math.max(0,Math.min(...xs)-1);x<=Math.min(G.gw-1,Math.max(...xs)+1);x++){const i=y*G.gw+x;if(test(cellLL(i)))cells.push(i)}
  const anyF=cells.some(i=>forestSet.has(G.cov[i]));
  for(const i of cells){const f=forestSet.has(G.cov[i]);st.n++;if(f)st.forest++;if(!anyF||f){st.sec[G.sec[i]]++;st.elev+=G.elev[i];st.rock[G.rock[i]]++}}
  const m=st.sec.reduce((a,b)=>a+b,0)||1;st.pct=st.sec.map(v=>v/m);st.elev=Math.round(st.elev/m);
  st.obaga=st.pct[7]+st.pct[0]+st.pct[1];st.solana=st.pct[3]+st.pct[4]+st.pct[5];return st}
const pip=(p,poly)=>{let c=false;for(let i=0,k=poly.length-1;i<poly.length;k=i++){const[yi,xi]=poly[i],[yk,xk]=poly[k];if(((yi>p[0])!==(yk>p[0]))&&(p[1]<(xk-xi)*(p[0]-yi)/(yk-yi)+xi))c=!c}return c};
const polyStats=poly=>{const la=poly.map(p=>p[0]),lo=poly.map(p=>p[1]);return zoneStats(p=>pip(p,poly),[Math.min(...lo),Math.min(...la),Math.max(...lo),Math.max(...la)])};
const circleStats=(lat,lng,r)=>{const k=Math.cos(lat*Math.PI/180),dl=r/111320,dn=r/(111320*k);return zoneStats(([a,b])=>((a-lat)*111320)**2+((b-lng)*111320*k)**2<=r*r,[lng-dn,lat-dl,lng+dn,lat+dl])};

/* ---------- Sortida del sol ---------- */
function madridOffset(n){const y=D(n).getUTCFullYear();const lastSun=m=>{let d=dnum(`${y}-${m}-31`);while(D(d).getUTCDay()!==0)d--;return d};return(n>=lastSun('03')&&n<lastSun('10'))?2:1}

async function planGeo(q){
  const g=await j('https://geocoding-api.open-meteo.com/v1/search?'+new URLSearchParams({name:q,count:10,language:'ca',countryCode:'ES'}));
  const r=(g.results||[]).filter(x=>/Catalu|Catalonia/.test(x.admin1||''));const p=(r.length?r:g.results||[])[0];

// fetch amb límit de temps: si un servei no respon, el pla surt igualment (sense aparcament o sense nom)
const tfetch=(u,o,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,Object.assign({signal:c.signal},o||{})).finally(()=>clearTimeout(t))};
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];

async function snapForest(la,lo){const n=4096,fx=(lo+180)/360*n,fy=(1-Math.asinh(Math.tan(la*Math.PI/180))/Math.PI)/2*n,x=Math.floor(fx),y=Math.floor(fy);

    let k=0;for(let b=-2;b<=2;b++)for(let a=-2;a<=2;a++)if(A(i+a,j+b)>=200)k++;if(k>=22)best=[dd,i,j]}

async function planPark(la,lo){

    if(t.amenity==='parking'){if(['private','no','customers'].includes(t.access))return;const p=e.center||{lat:e.lat,lon:e.lon};if(p.lat==null)return;

    const cand=[];for(const z of Z){if(cand.every(c=>distKm(z.lat,z.lng,c.lat,c.lng)>3))cand.push(z);if(cand.length===30)break}

    cand.forEach((z,i)=>{const Dd=W[i].daily,st=dnum(Dd.time[0]);
      const s={id:'pl'+i,lat:z.lat,lng:z.lng,alt:z.alt,zone:{st:{obaga:z.ob}},ser:{start:st,r:Dd.precipitation_sum,t:Dd.temperature_2m_mean,n:Dd.temperature_2m_min,end:st+Dd.time.length-1}};
      evalAt(s);const hit=s.wins.filter(w=>PLAN.days.some(d=>d>=w.a&&d<=w.b));

function renderPlan(){

  const live=GEV.filter(s=>s.state!=='wait').sort((a,b)=>val(a)-val(b));if(!live.length)return;
  const hiT=SP==='ceps'?60:75,midT=SP==='ceps'?35:55;  // com al calendari: groc fluixa, taronja normal, vermell bona
  const colOf=s=>{const v=val(s);return s.state==='soon'?'rgba(150,120,230,.75)':v>=hiT?'rgba(166,95,40,.96)':v>=midT?'rgba(214,160,100,.9)':'rgba(240,226,200,.9)'};
  if(!map.getPane('probP')){const pp=map.createPane('probP');pp.style.zIndex=282;pp.style.pointerEvents='none'}

  const PL=L.GridLayer.extend({createTile(c,done){

     <li>Si el bosc és sobretot obaga, ${R.obagaBonus} dies més al final.</li></ul>
     <p class="small">Regla provisional: encara no l'hem provada amb sortides vostres. Apunteu-les al diari, també les de zero, i es podrà ajustar.</p></div>`}
function genQue(){const S=SPECIES[SP],I=S.info;
  return `<div class="card how"><h3>Què busquem: ${S.nom.toLowerCase()}</h3>
     ${I.tipus?`<p>Aquí van junts tres bolets de pinar que surten a la mateixa època i amb el mateix temps:</p><ul>${I.tipus.map(([n,d])=>`<li><strong>${n}</strong>: ${d}</li>`).join('')}</ul>`:''}
     <ul><li><strong>On:</strong> ${I.arbre}</li><li><strong>Quan:</strong> ${I.epoca}</li><li><strong>Altura:</strong> ${I.alt}</li><li><strong>Pluja:</strong> ${I.pluja}</li><li><strong>Temperatura:</strong> ${I.temp}</li><li><strong>Gelades:</strong> ${I.gel}</li></ul>
     <p class="small">Fitxa orientativa feta amb dades de guies i de BoletRadar.cat. Cap bolet es menja sense identificar-lo bé: davant del dubte, no el collis.</p></div>`}
const genRecerca=()=>diesCard();
function renderCom(){
  $('#s-com').innerHTML=`
   <button class="back" data-back>‹ Tornar</button>
   ${SP==='ceps'?`   <div class="card how"><h3>Què busquem</h3>
     <ul><li><strong>Cep negre</strong> (<em>Boletus aereus</em>)</li><li><strong>Cep d'estiu</strong> (<em>Boletus aestivalis</em>)</li><li><strong>Ou de reig</strong> (<em>Amanita caesarea</em>)</li></ul>
     <p>Són espècies termòfiles, de calor. Surten en terrenys àcids (granit, pissarra, gresos), amb roures, alzines, alzines sureres i avellaners. Per això el mapa mira la roca i el tipus d'arbre.</p></div>`:SP==='rov'?ROV_QUE:genQue()}
   <div class="card how"><h3>Avisos</h3><p>Cada matí es mira la pluja dels vostres llocs. Quan n'ha caigut prou arriba un avís al mòbil, i un altre el dia abans del millor dia. Només de ceps i rovellons.</p>
     <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
       <li>Instal·la <strong>ntfy</strong>: <a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Android</a> · <a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">iPhone</a></li>
       <li>Toca <strong>+</strong> i escriu <span class="mono" style="color:var(--ink)">${AVIS_TEMA}</span> <button class="btn ghost" data-copytema style="padding:4px 10px;font-size:13px">Copia</button></li>
       <li>Subscriu-t'hi i deixa que t'enviï notificacions.</li></ol></div>
   <div class="card how"><h3>Obaga i solana</h3>
     <p>A partir d'un model del relleu, per a cada punt miro cap a on baixa el terreny. Si baixa cap al nord (nord, nord-est o nord-oest) és <b style="color:var(--obaga)">obaga</b>, i si baixa cap al sud, <b style="color:var(--solana)">solana</b>. Només ho pinto on el mapa de l'ICGC diu que hi ha bosc.</p></div>
   ${SP==='ceps'?`   <div class="card how"><h3>Què diu la recerca</h3>
     <p><strong>Quanta pluja?</strong> Perquè es "moguin" calen uns <strong>15–25 litres en 2–5 dies</strong>. Millor si el terra ja estava humit d'una pluja anterior: per amarar-lo bé, 40–100 litres en una o dues setmanes. Una ruixada d'estiu sola no n'hi ha prou.</p>
     <p><strong>Quina temperatura?</strong> Són espècies de calor. Surten després d'un període càlid, sovint quan una tempesta freda cau sobre terra calenta. Ideal: nits per sobre de 10–12 °C i dies entre 18 i 24 °C. Amb màximes de més de 28–30 °C s'aturen, i amb màximes de menys de 10 °C no creixen. Les vostres dues sortides bones (2022 i 2026) van tenir una mitjana d'uns 18 °C.</p>
     <p><strong>Quants dies tarden a sortir?</strong></p>
     <ul><li>Cep negre: 7–10 dies després d'una pluja forta.</li><li>Ceps en general: 10–15 dies després de la pluja més forta.</li><li>Ou de reig: 15–22 dies.</li><li>Les vostres sortides: 11 dies (2026) i 16–17 dies (2022).</li></ul>
     <p><strong>Quant duren?</strong> Cada cep passa de botó a adult en 3–7 dies (2–3 si fa calor i humitat) i al cap d'una setmana ja es fa malbé. Amb calor, els cucs i els llimacs se'l mengen abans. La tanda sencera d'una pluja dura uns 10–15 dies.</p>
     <p class="small">La majoria d'aquestes xifres són de boletaires experts i de guies italianes i espanyoles. Estudis científics amb números exactes per a aquestes espècies n'hi ha molt pocs. Per això el vostre diari és tan important.</p></div>
   <div class="card how"><h3>Dies de bolets</h3>
     <p>Regla provisional, ajustada perquè encerti les dues sortides bones que coneixem (25 d'octubre de 2022 i 17 d'octubre de 2026):</p>
     <ul><li>Si en ${RULE.span} dies seguits cauen ${RULE.mm} litres o més…</li>
     <li>…i els dies <strong>després</strong> de la pluja la temperatura mitjana passa de ${RULE.minT} °C (és quan creixen: si fa fred, no surten, encara que plogués amb calor)…</li>
     <li>…el <strong>millor dia</strong> és ${RULE.wait} dies després del primer dia que es passa el llindar, i hi ha bolets del dia ${RULE.wait-RULE.before} al ${RULE.wait+RULE.after}.</li>
     <li>Si el bosc és sobretot obaga, ${RULE.obagaBonus} dia més al final.</li></ul>
     <p><strong>Per què 5 dies i no 10?</strong> Les dues bones sortides que coneixem, totes dues al mateix lloc, van ser 15 dies (2026) i 17 dies (2022) després de la primera pluja forta. La mitjana és 16. La recerca diu el mateix: els ceps surten sobretot 13–15 dies després de la pluja més forta, i cada cep és bo pocs dies abans de fer-se malbé. Per això la finestra és 16 ± 2 dies: cobreix tot el que hem vist amb un dia de marge per banda i passa d'uns 40 dies possibles per temporada a uns 18.</p></div>`:SP==='rov'?rovRecerca():genRecerca()}
   <div class="card how"${SP==='rov'?' hidden':''}><h3>Com de bona és la tanda</h3>
     <p>Els dies verds diuen <strong>quan</strong>. La força (de 0 a 100) diu <strong>quants</strong> en podeu esperar, i es fa amb aquestes coses:</p>
     <ul><li><strong>Pluja</strong> de tot l'episodi: amb ${SPECIES[SP].forca.mm[0]} l no n'hi ha gaire; amb ${SPECIES[SP].forca.mm[1]} l o més, ja n'hi ha prou.</li>
     <li><strong>Temperatura</strong> mitjana mentre creixen: ideal entre ${SPECIES[SP].forca.t[1]} i ${SPECIES[SP].forca.t[2]} °C; per sota de ${SPECIES[SP].forca.t[0]} o per sobre de ${SPECIES[SP].forca.t[3]} °C, res.</li>
     <li><strong>Època</strong>: cada mes té el seu pes (els millors: ${Object.entries(SPECIES[SP].forca.mes).filter(([,v])=>v>=.9).map(([m])=>MESOS_C[m]).join(' i ')}).</li>
     <li><strong>Gelades</strong>: cada nit a −2 °C o menys mentre creixen resta punts (si es tenen les temperatures mínimes d'aquells dies).</li></ul>
     <p><strong>Bona</strong> (60 o més), <strong>normal</strong> (35–59) o <strong>fluixa</strong> (menys de 35).${SP==='ceps'?` Amb les vostres sortides: la tanda del 2 d'octubre (8 ceps) treu 100, la del 2022 (20 ceps) 46, i la del 18 d'octubre (0 ceps el 31) només 24, perquè va créixer amb 14 °C i ja de novembre.`:' Encara no hi ha sortides de rovellons per comprovar-ho.'}</p></div>
   <div class="card how"><h3>D'on surt la pluja</h3>
     <p>Pluja estimada per a cada lloc, de models d'alta resolució (d'1 a 3 km), via Open-Meteo. Cada cop que obres l'app es baixen els últims dies i la previsió de 7 dies; sense connexió es fa servir l'última que tenies. Al calendari de cada lloc pots tirar enrere fins al 2016 per veure si la regla hauria encertat.</p></div>
   <div class="card how"><h3>Ajustar la regla</h3>
     <p class="small">Mou els números i mira als calendaris si els dies verds coincideixen amb els dies que vau trobar ${SPECIES[SP].u[1]}.</p>
     ${(SP==='rov'?[['half','Vida mitjana de la humitat','dies',3,20],['lag','Retard entre la pluja i els rovellons','dies',0,10],['hlo','Humitat que no és res','l',5,40],['hhi','Humitat que ja és de sobra','l',30,120]]:[['mm','Pluja mínima','l',10,80],['span','En quants dies','dies',1,7],['minT','Temperatura mínima després de la pluja','°C',0,22],...(RULE.maxT!=null?[['maxT','Temperatura màxima després de la pluja','°C',8,28]]:[]),['wait','Millor dia (dies després de la pluja)','dies',5,30],['before','Marge abans','dies',0,7],['after','Marge després','dies',0,10],['obagaBonus','Dies extra si és obaga','dies',0,6]])
       .map(([k,l,u,a,b])=>`<div class="slider"><label for="r-${k}">${l}</label><output id="o-${k}">${RULE[k]} ${u}</output><input type="range" id="r-${k}" data-k="${k}" data-u="${u}" min="${a}" max="${b}" value="${RULE[k]}"></div>`).join('')}
     <button class="btn ghost" id="rreset" style="align-self:flex-start">Tornar a la regla provisional</button></div>`;
  $('#s-com').querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{RULE[inp.dataset.k]=+inp.value;$('#o-'+inp.dataset.k).textContent=inp.value+' '+inp.dataset.u;store.set(SPECIES[SP].key,RULE);SITES.forEach(evalAt)});
  $('#rreset').onclick=()=>{store.set(SPECIES[SP].key,{});RULE=loadRule();SITES.forEach(evalAt);renderCom()}}

/* ---------- Navegació ---------- */
let mapBuilt=false,lastTab='llocs',screen='llocs';
function show(t){
  screen=t;document.body.dataset.screen=t;
  if(t!=='ruta'){const rr=$('#s-ruta');if(rr)rr.innerHTML=''}   // la pantalla En ruta no es deixa amagada (duplicaria botons)
  document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!=='s-'+t);
  if(t==='llocs'||t==='mapa'||t==='diari'){lastTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t))}
  if(t==='llocs')renderLlocs();
  if(t==='diari')renderDiari();
  if(t==='mapa'){const first=!mapBuilt;if(!mapBuilt){buildMap();mapBuilt=true}else drawPins();setTimeout(()=>{map.invalidateSize();if(first&&!L1.moved)L1.fit()},30)}
  if(t==='com')renderCom();
  if(t==='plan')renderPlan();
  paintRec();
  if(t==='buscar')renderBuscar();
  window.scrollTo(0,0)}
function setSpecies(k){
  if(!SPECIES[k])return;SP=k;store.set('sp',k);RULE=loadRule();SITES.forEach(evalAt);form=null;
  document.querySelectorAll('[data-sp]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sp===k));
  document.documentElement.dataset.species=k;
  if(mapBuilt)drawPins();
  if(mapBuilt){if(tap){map.removeLayer(tap);tap=null}$('#mapcard').innerHTML='';region().then(drawSpots);drawProb()}
  if(screen==='fitxa')renderFitxa();else show(screen)}
$('#spsw').innerHTML=SHOW.map(k=>`<button data-sp="${k}" aria-pressed="${k===SP}">${spIcon(22,k)}${SPECIES[k].nom}</button>`).join('');
setSpecies(SP);
document.addEventListener('click',e=>{
  const spb=e.target.closest('[data-sp]');if(spb){setSpecies(spb.dataset.sp);return}
  const os=e.target.closest('[data-onsoc]');if(os){if(!navigator.geolocation){$('#mapcard').innerHTML='<p>Aquest mòbil no deixa saber on ets.</p>';return}os.classList.add('busy');
    navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];os.classList.remove('busy');L1.moved=true;map.setView(ll,12);
      if(L1.me)map.removeLayer(L1.me);L1.me=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2F67A6',fillOpacity:1}).addTo(map)},
      ()=>{os.classList.remove('busy');$('#mapcard').innerHTML="<p>No s'ha pogut saber on ets. Mira que el mòbil deixi fer servir la ubicació.</p>"},{enableHighAccuracy:true,timeout:15000});return}
  if(e.target.closest('[data-mclose]')){$('#mapcard').innerHTML='';if(tap){map.removeLayer(tap);tap=null}return}
  const cp=e.target.closest('[data-capes]');if(cp){const pn=$('#s-mapa .laypanel');pn.hidden=!pn.hidden;cp.setAttribute('aria-expanded',!pn.hidden);return}
  if(e.target.closest('[data-gomap]')){show('mapa');return}
  const t=e.target.closest('.tabs button');if(t){show(t.dataset.t);return}
  if(e.target.closest('#howbtn')){show('com');return}
  if(e.target.closest('[data-goplan]')){show('plan');return}
  const bo=e.target.closest('[data-bol]');if(bo){if(bo.dataset.bol==='altre'){altreOpen=!altreOpen;renderRuta()}else recBolet(bo.dataset.bol);return}
  const bn=e.target.closest('[data-boln]');if(bn&&REC){const p=REC.pts[+bn.dataset.boln];p.n=(p.n||1)+1;saveRec();recMsg=`${bNom(p)} ×${p.n}`;paintRec();return}
  const bd=e.target.closest('[data-boldel]');if(bd&&REC){const[p]=REC.pts.splice(+bd.dataset.boldel,1);saveRec();recMsg=`Esborrat: ${bNom(p)}`;paintRec();return}
  if(e.target.closest('[data-goruta]')){show('ruta');return}
  if(e.target.closest('[data-recmapnow]')){if(REC)recMap(REC);return}
  const re=e.target.closest('[data-recend]');if(re){if(re.dataset.sure){recEnd()}else{re.dataset.sure='1';re.textContent='Segur?';setTimeout(()=>{if(re.isConnected){delete re.dataset.sure;re.textContent='Acaba'}},4000)}return}
  const rg=e.target.closest('[data-recgpx]');if(rg){const gi=$('#gpxin');if(gi){gi.dataset.i=rg.dataset.recgpx;gi.click()}return}
  const rd=e.target.closest('[data-recdel]');if(rd){if(rd.dataset.sure){RECS.splice(+rd.dataset.recdel,1);saveRec();if(screen==='diari')renderDiari();else renderRuta()}else{rd.dataset.sure='1';rd.textContent='Segur?';rd.style.color='var(--soon)';setTimeout(()=>{if(rd.isConnected){delete rd.dataset.sure;rd.textContent='Esborra';rd.style.color=''}},4000)}return}
  const rx=e.target.closest('[data-recdiscard]');if(rx){if(rx.dataset.sure){REC=null;recMsg='';saveRec();paintRec();show('diari')}else{rx.dataset.sure='1';rx.textContent="Segur? Es perden els bolets d'aquesta sortida";setTimeout(()=>{if(rx.isConnected){delete rx.dataset.sure;rx.textContent='Descarta la sortida (sense desar-la)'}},4000)}return}
  const rm=e.target.closest('[data-recmap]');if(rm){recMap(RECS[+rm.dataset.recmap]);return}
  const rs=e.target.closest('[data-recsend]');if(rs){recShare(RECS[+rs.dataset.recsend]);return}
  const pd=e.target.closest('[data-pld]');if(pd){const d=+pd.dataset.pld;PLAN.days=PLAN.days.includes(d)?PLAN.days.filter(x=>x!==d):[...PLAN.days,d].sort();renderPlan();return}
  const pk=e.target.closest('[data-plkm]');if(pk){PLAN.km=+pk.dataset.plkm;renderPlan();return}
  if(e.target.closest('[data-plgeo]')){if(!navigator.geolocation){PLAN.msg='Aquest mòbil no deixa saber on ets.';renderPlan();return}PLAN.msg='Buscant on ets…';renderPlan();
    navigator.geolocation.getCurrentPosition(p=>{PLAN.pt={lat:p.coords.latitude,lng:p.coords.longitude,name:'on ets'};PLAN.msg='';planRun()},()=>{PLAN.msg="No s'ha pogut saber on ets.";renderPlan()},{enableHighAccuracy:false,timeout:15000});return}
  const pm=e.target.closest('[data-plmap]');if(pm){planMap(+pm.dataset.plmap);return}
  const zf=e.target.closest('[data-zoom]');if(zf){lightbox(zf.dataset.zoom,+zf.dataset.i);return}
  const ap=e.target.closest('[data-addph]');if(ap){if(!GH.tok()){ghOpen=true;renderDiari();$('#ghcard').scrollIntoView({behavior:'smooth'});return}const fi=$('#phin');fi.dataset.key=ap.dataset.addph;fi.click();return}
  const ae=e.target.closest('[data-ambed]');if(ae){if(!GH.tok()){ghOpen=true;renderDiari();$('#ghcard').scrollIntoView({behavior:'smooth'});return}dEdit=ae.dataset.ambed;renderDiari();const i=$('[data-ambf] input');if(i)i.focus();return}
  const o=e.target.closest('[data-open]');if(o){openSite(o.dataset.open,o.dataset.from);return}
  if(e.target.closest('[data-back]')){show(screen==='fitxa'?cur.from:screen==='plan'?'mapa':lastTab);return}
  const dy=e.target.closest('[data-day]');if(dy){selDay=+dy.dataset.day;$('#s-fitxa').querySelectorAll('.day.sel').forEach(x=>x.classList.remove('sel'));dy.classList.add('sel');$('#daynote').innerHTML=dayNote(cur,selDay);return}
  const cb=e.target.closest('[data-cal]');if(cb&&!cb.disabled){calOff=Math.min(0,calOff+ +cb.dataset.cal);renderFitxa();return}
  if(e.target.closest('[data-newvisit]')){const now=new Date();form={d:dstr(TODAY),n:0,h:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,est:[],nota:''};renderFitxa();return}
  if(e.target.closest('[data-cancel]')){form=null;renderFitxa();return}
  if(e.target.closest('[data-save]')){const nv={d:$('#fdate').value||dstr(TODAY),site:cur.id,sp:SP,n:form.n,h:$('#fh').value,est:form.est,nota:$('#fnota').value.trim()};visits.push(nv);saveVisits();
    // amb la clau de GitHub, la sortida també va al diari compartit (data/llocs.json)
    if(GH.tok())GH.edit('data/llocs.json',d=>{d.visits=d.visits||[];if(!d.visits.some(v=>v.d===nv.d&&v.site===nv.site&&(v.sp||'ceps')===nv.sp&&v.n===nv.n))d.visits.push(nv);return d},`Sortida del ${nv.d}`).catch(()=>{});form=null;renderFitxa();return}
  if(e.target.closest('[data-showmap]')){const s=cur;L1.moved=true;show('mapa');setTimeout(()=>{map.invalidateSize();map.setView([s.lat,s.lng],15);pinCard(s)},60);return}
  const ah=e.target.closest('[data-addhere]');if(ah){const[la,lo]=ah.dataset.addhere.split(',').map(Number);
    $('#mapcard').innerHTML=`<strong>Lloc nou</strong><form id="addf" class="sheet"><div><label for="addn">Nom</label><input id="addn" maxlength="40" required style="font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;box-sizing:border-box"></div><button class="btn">Desa el lloc</button></form><p class="small">Es guarda en aquest mòbil.</p>`;
    $('#addn').focus();$('#addf').onsubmit=ev=>{ev.preventDefault();const ex=store.get('extra',[]);ex.push({sp:[SP],id:'x'+Date.now().toString(36),name:$('#addn').value.trim()||'Lloc nou',muni:'',lat:la,lng:lo});store.set('extra',ex);store.set('obre','llocs');location.reload()};return}
  const dl=e.target.closest('[data-delsite]');if(dl){if(dl.dataset.sure){store.set('extra',store.get('extra',[]).filter(x=>x.id!==dl.dataset.delsite));location.reload()}else{dl.dataset.sure='1';dl.textContent='Toca un altre cop per esborrar-lo'}return}
  const ct=e.target.closest('[data-copytema]');if(ct){(navigator.clipboard?navigator.clipboard.writeText(AVIS_TEMA):Promise.reject()).then(()=>{ct.textContent='Copiat'}).catch(()=>{ct.textContent=AVIS_TEMA});return}
  const bq=e.target.closest('[data-bq]');if(bq){BQ[bq.dataset.bq]=bq.dataset.v;store.set('buscar',BQ);renderBuscar();return}
  const hm=e.target.closest('[data-home]');if(hm){if(hm.dataset.home==='reset'){store.set('home',null);renderBuscar()}else if(navigator.geolocation){hm.textContent='Buscant…';navigator.geolocation.getCurrentPosition(p=>{store.set('home',{nom:'on ets ara',lat:p.coords.latitude,lng:p.coords.longitude});renderBuscar()},()=>{hm.textContent='No s\'ha pogut'},{timeout:15000})}return}
  const zm=e.target.closest('[data-zmap]');if(zm){const z=REG.zones[+zm.dataset.zmap];L1.moved=true;show('mapa');setTimeout(async()=>{map.invalidateSize();map.setView([z.lat,z.lng],15);await toggleSim(null,true);
    if(tap)map.removeLayer(tap);tap=L.marker([z.lat,z.lng],{icon:L.divIcon({className:'',html:'<div class="tapmark"></div>',iconSize:[14,14],iconAnchor:[7,7]}),interactive:false}).addTo(map);
    $('#mapcard').innerHTML=`<strong>Zona de ${z.ha} ha</strong><p class="small">${Math.round(z.ob*100)}% obaga · ${Math.round(z.so*100)}% solana · ${z.arbre} · ${z.alt} m</p><div class="row"><a class="btn ghost" href="${gmDir(z.lat,z.lng)}" target="_blank" rel="noopener">Com arribar-hi</a><button class="btn ghost" data-zadd="${zm.dataset.zmap}">Afegir als meus llocs</button></div>`},80);return}
  const za=e.target.closest('[data-zadd]');if(za){const z=REG.zones[+za.dataset.zadd];const H=store.get('home',null)||REG.home;const ex=store.get('extra',[]);
    ex.push({sp:[SP],id:'x'+Date.now().toString(36),name:`Zona a ${distKm(H.lat,H.lng,z.lat,z.lng).toFixed(0)} km (${bearing(H.lat,H.lng,z.lat,z.lng)})`,muni:'',lat:z.lat,lng:z.lng});store.set('extra',ex);store.set('obre','llocs');location.reload();return}
  const dr=e.target.closest('[data-draw]');if(dr){const s=SITES.find(x=>x.id===dr.dataset.draw);map.setView([s.lat,s.lng],15);startDraw(s.id);return}
});
show('llocs');store.set('obre','');paintRec();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
